name: Experiment lab
# Tests every indicator on the top 30 coins and every timeframe, 24/7, with no phone needed.
# Results go to the "exp-data" branch (one commit, replaced every run, so the repo does not grow).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: experiment-lab
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy requests
      - name: Load previous experiment data
        run: |
          mkdir -p expdata
          if git fetch --depth=1 origin exp-data 2>/dev/null; then
            for f in exp_state.json exp_stats.json; do
              git show FETCH_HEAD:$f > expdata/$f 2>/dev/null || rm -f expdata/$f
            done
          else
            echo "First run: starting fresh"
          fi
      - name: Run experiments
        env:
          EXP_DIR: expdata
          EXP_COINS: "30"
          EXP_TFS: "5m,15m,30m,1h,4h,1d"
        run: python experiments.py
      - name: Publish to the exp-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd expdata
          git init -q
          git checkout -q -b exp-data
          git add -A
          git -c user.name=experiment-lab -c user.email=experiment-lab@users.noreply.github.com commit -qm "experiment data $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" exp-data
